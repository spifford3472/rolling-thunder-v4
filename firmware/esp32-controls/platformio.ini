[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -Wall
    -Wextra
    -Werror

; Explicit development target; legacy esp32dev remains the default.
[env:esp32dev-recovery]
platform = espressif32@7.0.1
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DRTCTRL_RECOVERY_V2
