name: Fix PR194 Applicator

on:
  push:
    branches:
      - fix/dashboard-readability-truthfulness
    paths:
      - .github/workflows/fix-pr194-applicator.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/dashboard-readability-truthfulness
          fetch-depth: 0

      - name: Correct exact weather font selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-pr194-followup.yml')
          text = path.read_text(encoding='utf-8')

          old_precip = '''          replace_once(weather_path, 'font=("DejaVu Sans", 20, "bold"),', 'font=("DejaVu Sans", 25, "bold"),')'''
          new_precip = '''          replace_once(\n              weather_path,\n              'font=("DejaVu Sans", 20, "bold"),\\n                anchor="center",',\n              'font=("DejaVu Sans", 25, "bold"),\\n                anchor="center",',\n          )'''
          if text.count(old_precip) != 1:
              raise RuntimeError('Expected one forecast precip selector.')
          text = text.replace(old_precip, new_precip, 1)

          old_status = '''          replace_once(weather_path, 'font=("DejaVu Sans", 22, "bold"),\\n            anchor="w",', 'font=("DejaVu Sans", 28, "bold"),\\n            anchor="w",')'''
          new_status = '''          replace_once(\n              weather_path,\n              'textvariable=self._alert_status_text,\\n            bg=_CARD_BACKGROUND,\\n            fg=_DISABLED,\\n            font=("DejaVu Sans", 22, "bold"),',\n              'textvariable=self._alert_status_text,\\n            bg=_CARD_BACKGROUND,\\n            fg=_DISABLED,\\n            font=("DejaVu Sans", 28, "bold"),',\n          )'''
          if text.count(old_status) != 1:
              raise RuntimeError('Expected one alert status selector.')
          text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected applicator
        run: |
          git rm .github/workflows/fix-pr194-applicator.yml
          git add .github/workflows/apply-pr194-followup.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct temporary PR194 applicator selectors"
          git push origin HEAD:fix/dashboard-readability-truthfulness
