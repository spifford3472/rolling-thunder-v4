operator:
  callsign: N0CALL
  home_grid: EM00aa

hardware:
  # Legacy default used when a per-device mode is null.
  mock: true
  radio_mode: null
  gps_mode: null
  radio_device: null
  radio_baud_rate: 38400
  radio_timeout_s: 1.0
  gps_device: null
  gps_baud_rate: 9600
  gps_timeout_s: 2.0

  # Example for testing the physical FT-891 while keeping GPS safely mocked:
  # radio_mode: real
  # gps_mode: mock
  # radio_device: /dev/serial/by-id/your-ft891-enhanced-com-port

  # Example for testing the physical GPS while keeping the radio safely mocked:
  # radio_mode: mock
  # gps_mode: real
  # gps_device: /dev/serial/by-id/your-gps-device

speech:
  enabled: false
  audio_device: default
  model_path: null
  capture_duration_seconds: 8
  sample_rate: 16000
  channels: 1

forge:
  enabled: false
  api_url: null
  request_timeout_s: 5.0
  refresh_interval_s: 60.0
  refresh_on_start: true
  max_response_bytes: 1048576
  callsign_info:
    # Independent Forge QRZ/Wavelog/current-weather service.
    enabled: false
    # Production example: http://192.168.9.170:8788
    api_url: null
    request_timeout_s: 5.0
    max_response_bytes: 65536
    # Maximum time a successfully loaded overlay remains visible.
    overlay_timeout_s: 120.0

  weather:
    # Consumes only Forge /api/v1/weather. The Pi never contacts a public
    # weather provider through this retained-weather path.
    enabled: false
    refresh_interval_s: 900.0
    refresh_on_start: true
    stale_after_s: 1800.0

  weather_alerts:
    # Location-aware severe-weather alerts require real GPS. When enabled,
    # current GPS is published to Forge at least every 15 seconds instead
    # of using the ordinary retained-location ten-minute cadence.
    enabled: false
    refresh_interval_s: 30.0
    refresh_on_start: false
    location_publish_interval_s: 15.0

    # Audible cues are synthesized locally and played through ALSA.
    # They are deliberately not EAS tones.
    audio_device: default

home_platform:
  # Contact synchronization uses the private Forge contact-sync service.
  # The Pi must never be configured to call Wavelog directly.
  enabled: false
  # Production example: http://192.168.9.170:8767
  base_url: null
  request_timeout_s: 5.0
  health_poll_interval_s: 30.0
  contact_sync_interval_s: 30.0
  contact_sync_batch_size: 25

network_keepalive:
  enabled: false
  target_url: null
  interval_s: 30.0
  timeout_s: 5.0

dmr:
  # Read-only WPSD/MMDVM monitoring. The restricted SSH key can only run
  # the rollingthunder-dmr-feed forced command on the hotspot.
  enabled: false
  host: null
  ssh_user: pi-star
  private_key: null
  http_timeout_s: 5.0
  connect_timeout_s: 5
  history_limit: 20
  history_refresh_interval_s: 30.0
  reconnect_delay_s: 2.0

# QRZ credentials are never stored in YAML. See docs/POTA_ENRICHMENT.md.
pota_spots:
  enabled: false
  base_url: https://api.pota.app
  request_timeout_s: 5.0
  refresh_interval_s: 60.0
  refresh_on_start: true

pota_map:
  # Uses the offline Checkpoint 2 catalog. Coordinates are approximate POTA
  # catalog pins, not navigation destinations or activation boundaries.
  enabled: true
  catalog_path: ../data/pota/pota-catalog.db
  label_min_zoom: 14
  dot_diameter_px: 24
  # Keep last-known POTA markers through brief GPS dropouts.
  gps_grace_period_s: 60.0

repeaters:
  # Deployment data lives outside Git worktrees so branch/worktree changes
  # cannot make the repeater panel lose its local CSV.
  source_path: ~/.local/share/rolling-thunder/repeaters/6m_repeaters.csv

map:
  enabled: true
  tile_url_template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  zoom: 15
  request_timeout_s: 4.0
  gps_stale_after_s: 10.0
  cache_directory: data/map-tiles
  cache_retention_days: 7
  maximum_cached_tiles: 2048
  installed_packages:
    - ../data/maps/rolling-thunder-i71-corridor-night-z0-z15-v1.mbtiles
  style: night
  online_attribution: © OpenStreetMap contributors

radar:
  # Requires both map.enabled and forge.enabled. The Pi consumes only the
  # provider-neutral Forge radar API; NOAA/ArcGIS details never belong here.
  enabled: false
  manifest_refresh_interval_s: 60.0
  stale_after_s: 900.0
  hide_after_s: 1800.0
  opacity: 0.55

physical_controls:
  enabled: false
  transport: mock
  device: null
  baud_rate: 115200
  maximum_line_bytes: 256
  maximum_read_bytes: 4096
  maximum_events_per_drain: 32
  repeat_suppression_s: 0.25
  mappings:
    voice-button: voice
    commit-button: commit
    discard-button: discard

    panel-button-short: next_context
    panel-button-long: home_context

    context-button-1-short: panel_primary
    context-button-1-long: select_ai
    context-button-2-short: panel_secondary
    context-button-2-long: select_settings
    context-button-3-short: panel_tertiary
    context-button-3-long: panel_tertiary_long

    encoder-counterclockwise: move_previous
    encoder-clockwise: move_next
    encoder-switch-short: activate_selection
    encoder-switch-long: back

ft8:
  # Experimental v4.3 native FT8 foundation. Checkpoint 2 is domain-only:
  # enabling this flag does not compose a decoder, audio worker, PTT, or CAT TX.
  enabled: false
  qso:
    # Retry budget is per unchanged QSO transmit state/message, not per whole QSO.
    attempts_per_state: 6

storage:
  database_path: data/rolling-thunder.db
  contact_backups:
    enabled: false
    directory: backups/contacts
    retention_count: 10
