# Rolling Thunder mobile antenna reference, schema 1.
#
# These records preserve operator claims supplied 2026-10-13. They are not
# manufacturer-verified specifications or a completed RF exposure evaluation.
# Feedline and duplexer attenuation are deliberately unknown, so every
# installation has losses_complete: false and every calculation remains
# incomplete. ONLY DRIVER antenna distances were physically measured by the
# operator. All 12 scenarios therefore use front_seat_measured with
# occupant_distance_verified: true. Passenger and public distances remain
# unknown; occupant/public and multiantenna risk or safety cannot be concluded.
# The dashboard loads this file read-only and never edits it.
#
# The ATAS-120A has only the five discrete bands actually supplied. In
# particular, 30 m, 17 m, and 12 m are omitted pending explicit operator or
# retained-source confirmation. Scenario frequencies are documented engineering
# reference points inside each supplied band, not operator claims. The ARRL
# typical-ground model is a conservative calculator assumption, not a
# vehicle-specific model or an operator-supplied measurement.
