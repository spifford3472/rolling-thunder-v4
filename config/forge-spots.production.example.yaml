server:
  # Replace with the Forge RadioLAN address.
  # Do not bind this service to 0.0.0.0.
  bind_host: 192.168.9.170
  bind_port: 8766

storage:
  # systemd StateDirectory=rolling-thunder owns this persistent location.
  database_path: /var/lib/rolling-thunder/forge-spots.db

aggregation:
  refresh_interval_s: 60.0
  # Local cache publication only; does not increase upstream DX network traffic.
  dx_cache_publish_interval_s: 5.0
  refresh_on_start: true

pota:
  enabled: true
  base_url: https://api.pota.app
  request_timeout_s: 5.0

dxspider:
  # Legacy source retained only for rollback/reference. Keep disabled when DX Summit is used.
  enabled: false
  host: dxc.wb3ffv.us
  port: 7300

  # Replace with the licensed operator callsign used for DXSpider login.
  login_callsign: N0CALL

  connect_timeout_s: 5.0
  read_timeout_s: 5.0
  inactivity_timeout_s: 600.0
  reconnect_initial_s: 5.0
  reconnect_max_s: 300.0
  stable_connection_s: 300.0
  max_response_bytes: 262144
  max_spots: 250
  max_spot_age_s: 3600.0

dxsummit:
  # Preferred DX source. Forge owns one long-lived read-only IRC session.
  # Connection age alone never causes a reconnect.
  enabled: false
  host: irc.radiochat.org
  port: 6667
  channel: "#CQDX"
  nickname: N0CALL
  connect_timeout_s: 15.0
  read_timeout_s: 5.0
  inactivity_timeout_s: 600.0
  reconnect_initial_s: 5.0
  reconnect_max_s: 300.0
  stable_connection_s: 300.0
  max_spots: 500
  max_spot_age_s: 3600.0

qrz:
  # QRZ credentials never belong in YAML.
  #
  # If enabled, provide them only through:
  #   /etc/rolling-thunder/forge-spots.env
  #
  # ROLLING_THUNDER_QRZ_USERNAME=...
  # ROLLING_THUNDER_QRZ_PASSWORD=...
  enabled: false
  request_timeout_s: 5.0
  minimum_request_interval_s: 1.0
  max_lookups_per_refresh: 25
  positive_ttl_s: 86400.0
  negative_ttl_s: 3600.0
  max_cache_entries: 2000

weather:
  # Checkpoint #162 production enables retained Open-Meteo weather explicitly.
  # Provider-specific weather codes are normalized before persistence/API use.
  enabled: true
  endpoint: https://api.open-meteo.com/v1/forecast
  request_timeout_s: 5.0
  check_interval_s: 60.0
  max_forecast_age_s: 1800.0
  movement_refresh_km: 10.0
  refresh_on_start: true

weather_alerts:
  # Enable only after #182 Forge deployment acceptance. The NWS active-alert
  # request is point-specific to the latest trusted retained mobile location.
  enabled: false
  endpoint: https://api.weather.gov/alerts/active
  user_agent: "RollingThunder-v4/1.0 (https://github.com/spifford3472/rolling-thunder-v4)"
  request_timeout_s: 5.0
  check_interval_s: 30.0
  location_max_age_s: 120.0
  refresh_on_start: true

radar:
  # Checkpoint #163 production enables NOAA/NWS MRMS radar explicitly.
  # Forge owns provider discovery and exact-frame raster locking; the Pi never
  # depends directly on NOAA/ArcGIS fields or URLs.
  enabled: true
  endpoint: https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer
  request_timeout_s: 5.0
  check_interval_s: 60.0
  stale_after_s: 900.0
  hide_after_s: 1800.0
  maximum_cached_tiles: 256
  refresh_on_start: true

logging_level: INFO
