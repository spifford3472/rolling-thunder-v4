server:
  # Loopback-only by default. Production exposure is intentionally deferred.
  bind_host: 127.0.0.1
  bind_port: 8765

storage:
  # Relative paths resolve from this configuration file.
  database_path: ../data/forge-spots.db

aggregation:
  refresh_interval_s: 60.0
  refresh_on_start: true

pota:
  enabled: true
  base_url: https://api.pota.app
  request_timeout_s: 5.0

dxspider:
  # Replace these example values before enabling a public callsign-login node.
  enabled: false
  host: cluster.example.invalid
  port: 7300
  login_callsign: N0CALL
  connect_timeout_s: 5.0
  read_timeout_s: 5.0
  max_response_bytes: 262144
  max_spots: 250
  max_spot_age_s: 3600.0

qrz:
  # Credentials come only from ROLLING_THUNDER_QRZ_USERNAME and
  # ROLLING_THUNDER_QRZ_PASSWORD. They never belong in this file.
  enabled: false
  request_timeout_s: 5.0
  minimum_request_interval_s: 1.0
  max_lookups_per_refresh: 25
  positive_ttl_s: 86400.0
  negative_ttl_s: 3600.0
  max_cache_entries: 2000

weather:
  # Open-Meteo is normalized behind a Rolling Thunder-owned provider boundary.
  # Weather refreshes use the latest retained mobile location and never block
  # the Forge HTTP request handler or any Pi core function.
  enabled: true
  endpoint: https://api.open-meteo.com/v1/forecast
  request_timeout_s: 5.0
  check_interval_s: 60.0
  max_forecast_age_s: 1800.0
  movement_refresh_km: 10.0
  refresh_on_start: true

logging_level: INFO
