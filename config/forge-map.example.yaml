bind_host: 127.0.0.1
bind_port: 8766

# Private/local TileServer GL-compatible renderer. This endpoint must use the
# locally extracted Protomaps geography and local day/night style assets. It
# must not point at OpenStreetMap public raster/vector tile services.
renderer_url_template: http://127.0.0.1:8080/styles/{style}/{z}/{x}/{y}.png
request_timeout_s: 10.0
minimum_request_interval_s: 0.05
attribution: © OpenStreetMap contributors · Protomaps
