[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolling-thunder"
version = "4.4.0"
description = "Mobile amateur radio operating and logging console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10,<13",
    "pycountry>=26.2,<27",
    "pydantic>=2,<3",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
rolling-thunder = "rolling_thunder.cli:cli"
rolling-thunder-ui = "rolling_thunder.ui_main:main"
rolling-thunder-forge-spots = "rolling_thunder.forge_spot_main:main"
rolling-thunder-forge-map = "rolling_thunder.forge_map_main:main"
rolling-thunder-forge-contact-sync = "rolling_thunder.forge_contact_sync_main:main"
rolling-thunder-forge-callsign-info = "rolling_thunder.forge_callsign_info_main:main"
rolling-thunder-forge-propagation = "rolling_thunder.forge_propagation_main:main"
rolling-thunder-forge-propagation-qso-worker = "rolling_thunder.forge_propagation_qso_worker_main:main"
rolling-thunder-forge-pskreporter-worker = "rolling_thunder.forge_pskreporter_worker_main:main"
rolling-thunder-forge-ft8-historical-replay = "rolling_thunder.forge_ft8_historical_replay_main:main"
rolling-thunder-forge-ft8-readiness = "rolling_thunder.forge_ft8_readiness_main:main"
rolling-thunder-forge-ft8-readiness-preflight = "rolling_thunder.forge_ft8_readiness_preflight:main"
rolling-thunder-forge-voacap-baseline = "rolling_thunder.forge_voacap_baseline_main:main"
rolling-thunder-forge-voacap-plan = "rolling_thunder.forge_voacap_plan_main:main"
rolling-thunder-forge-solar-ssn = "rolling_thunder.forge_solar_ssn:main"
rolling-thunder-pota-catalog = "rolling_thunder.pota_catalog_main:main"

[project.optional-dependencies]
speech = [
    "vosk==0.3.45",
]
development = [
    "mypy",
    "types-pyserial",
    "types-PyYAML",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.10",
    "typing-extensions>=4.15; python_version < '3.13'",
    "pyshp>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rolling_thunder"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolling_thunder"]
