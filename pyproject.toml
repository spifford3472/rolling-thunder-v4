[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolling-thunder"
version = "4.1.0"
description = "Mobile amateur radio operating and logging console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
rolling-thunder = "rolling_thunder.cli:cli"
rolling-thunder-ui = "rolling_thunder.ui_main:main"

[project.optional-dependencies]
development = [
    "mypy",
    "types-pyserial",
    "types-PyYAML",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rolling_thunder"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolling_thunder"]
