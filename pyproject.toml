[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolling-thunder"
version = "4.1.0"
description = "Mobile amateur radio operating and logging console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10,<13",
    "pycountry>=26.2,<27",
    "pydantic>=2,<3",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
rolling-thunder = "rolling_thunder.cli:cli"
rolling-thunder-ui = "rolling_thunder.ui_main:main"
rolling-thunder-forge-spots = "rolling_thunder.forge_spot_main:main"
rolling-thunder-forge-map = "rolling_thunder.forge_map_main:main"
rolling-thunder-forge-contact-sync = "rolling_thunder.forge_contact_sync_main:main"
rolling-thunder-pota-catalog = "rolling_thunder.pota_catalog_main:main"
rolling-thunder-ft891-atas-probe = "rolling_thunder.ft891_atas_probe_main:main"

[project.optional-dependencies]
speech = [
    "vosk==0.3.45",
]
development = [
    "mypy",
    "types-pyserial",
    "types-PyYAML",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rolling_thunder"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolling_thunder"]
