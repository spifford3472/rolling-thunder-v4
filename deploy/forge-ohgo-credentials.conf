# Staged systemd drop-in ONLY. Never automatically install or activate it.
# Operator must obtain an OHGO key, save it securely on Forge outside Git,
# approve host configuration, and test the existing Forge service first.
[Service]
Environment=ROLLING_THUNDER_OHGO_ENABLED=1
LoadCredential=ohgo-api-key:/etc/rolling-thunder/ohgo-api-key
