repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: .venv/bin/ruff check src tests
        language: system
        pass_filenames: false

      - id: mypy
        name: MyPy
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: bash -c 'PYTHONPATH=src .venv/bin/python -m pytest'
        language: system
        pass_filenames: false
