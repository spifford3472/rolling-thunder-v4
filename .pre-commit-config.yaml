repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check src tests
        language: system
        pass_filenames: false

      - id: mypy
        name: MyPy
        entry: mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: pytest
        language: system
        pass_filenames: false
